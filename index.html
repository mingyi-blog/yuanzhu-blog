<style>
:root{
  --ink:#1d1d1f; --sub:#6b6b70; --line:#ECE9E3;
  --brand:#C2622C; --brand2:#E08A4B; --bg:#FBFAF7;
  --card:#FFFFFF; --shadow:0 8px 30px rgba(40,30,20,.07);
  --wrap:740px;
  --serif:"Songti SC","SimSun",Georgia,"Noto Serif SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);
  font:16px/1.95 var(--sans);-webkit-font-smoothing:antialiased;}
a{color:var(--brand);text-decoration:none;}
.wrap{max-width:var(--wrap);margin:0 auto;padding:0 26px;}

/* 首页 */
header.hero{padding:84px 0 60px;
  background:linear-gradient(160deg,#fff7ef 0%,#fbfaf7 60%);
  border-bottom:1px solid var(--line);margin-bottom:48px;}
header.hero .badge{display:inline-block;font-size:12px;letter-spacing:2px;
  color:var(--brand);border:1px solid rgba(194,98,44,.3);border-radius:999px;
  padding:4px 12px;margin-bottom:22px;text-transform:uppercase;}
header.hero h1{margin:0;font-family:var(--serif);font-weight:700;
  font-size:46px;line-height:1.25;letter-spacing:.5px;}
header.hero p{margin:16px 0 0;color:var(--sub);font-size:17px;max-width:520px;}
.list{list-style:none;padding:0;margin:0 0 40px;}
.list li{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:24px 26px;margin-bottom:18px;box-shadow:var(--shadow);
  transition:.2s;}
.list li:hover{transform:translateY(-3px);box-shadow:0 14px 38px rgba(40,30,20,.10);}
.list a{color:var(--ink);font-family:var(--serif);font-size:22px;font-weight:700;}
.list .s{color:var(--sub);font-size:15px;margin-top:10px;line-height:1.7;}
.list .d{color:#a39c93;font-size:12px;margin-top:12px;letter-spacing:.5px;}
footer.site{margin:72px 0 56px;padding-top:28px;border-top:1px solid var(--line);
  color:var(--sub);font-size:13px;}

/* 文章页 */
article{max-width:var(--wrap);margin:0 auto;padding:72px 26px 0;}
.cover{margin:-72px -26px 0;padding:88px 26px 56px;
  background:linear-gradient(155deg,#fff3e6 0%,#fbfaf7 70%);
  border-bottom:1px solid var(--line);}
.cover .k{font-size:12px;letter-spacing:3px;color:var(--brand);text-transform:uppercase;}
.cover h1{font-family:var(--serif);font-weight:700;font-size:40px;line-height:1.3;
  margin:18px 0 0;letter-spacing:.5px;}
.cover .meta{color:var(--sub);font-size:14px;margin-top:20px;}
.tags{margin:30px 0 0;}
.tags span{display:inline-block;background:var(--card);border:1px solid var(--line);
  color:var(--sub);font-size:12px;padding:4px 12px;border-radius:999px;margin-right:8px;}
.lead{font-family:var(--serif);font-size:21px;line-height:1.85;color:#3a3a3c;
  border-left:3px solid var(--brand2);padding:4px 0 4px 22px;margin:44px 0 8px;}
.body h2{counter-increment:sec;font-family:var(--serif);font-weight:700;
  font-size:25px;line-height:1.5;margin:52px 0 18px;padding-top:8px;}
.body h2::before{content:"0" counter(sec);display:block;font-family:var(--sans);
  font-size:13px;font-weight:700;letter-spacing:2px;color:var(--brand);margin-bottom:8px;}
.body h3{font-size:18px;font-weight:700;color:var(--brand);
  margin:30px 0 10px;padding-left:14px;border-left:3px solid var(--brand2);}
.body p{margin:0 0 18px;color:#2c2c2e;}
.body ul{margin:0 0 18px;padding-left:0;list-style:none;}
.body li{position:relative;padding-left:22px;margin:0 0 10px;color:#2c2c2e;}
.body li::before{content:"";position:absolute;left:4px;top:11px;
  width:7px;height:7px;border-radius:50%;background:var(--brand2);}
.body strong{color:var(--brand);font-weight:700;}
.quote{margin:36px 0;padding:26px 30px;background:linear-gradient(135deg,#fff6ec,#fdf3e8);
  border-radius:14px;border-left:4px solid var(--brand);
  font-family:var(--serif);font-size:20px;line-height:1.7;color:#7a431f;font-style:italic;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:38px 0;}
.stats .c{background:var(--card);border:1px solid var(--line);border-radius:14px;
  padding:22px 14px;text-align:center;box-shadow:var(--shadow);}
.stats .n{font-family:var(--serif);font-weight:700;font-size:30px;color:var(--brand);line-height:1.1;}
.stats .l{color:var(--sub);font-size:13px;margin-top:8px;line-height:1.5;}
.ai{background:#fff8f0;border:1px dashed var(--brand);color:#8a4b1f;
  font-size:13px;padding:11px 15px;border-radius:8px;margin:40px 0 48px;}
.back{display:inline-block;margin:46px 0 0;font-size:14px;color:var(--brand);
  border-bottom:1px solid rgba(194,98,44,.35);padding-bottom:2px;}
.more{margin:52px 0 0;padding-top:26px;border-top:1px solid var(--line);}
.more .t{font-size:12px;letter-spacing:2px;color:#a39c93;margin-bottom:14px;}
.more a{display:block;font-family:var(--serif);font-size:17px;font-weight:700;
  color:var(--ink);padding:9px 0;border-bottom:1px solid var(--line);}
.more a:hover{color:var(--brand);}
@media(max-width:640px){
  header.hero h1{font-size:34px;} .cover h1{font-size:30px;}
  .lead{font-size:18px;} .stats{grid-template-columns:1fr;}
  .body h2{font-size:22px;}
}
</style>
</head>
